# Builds and tests every push; only pushes to main deploy to Cloudflare Workers (the live site),
# so work on other branches can't replace what's live.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  – your Cloudflare account ID
name: Deploy to Cloudflare

on:
  push:
  workflow_dispatch:

concurrency:
  # Deploys to the live site queue up one after another; test runs on other branches don't wait for them.
  group: ${{ github.ref == 'refs/heads/main' && 'deploy' || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
