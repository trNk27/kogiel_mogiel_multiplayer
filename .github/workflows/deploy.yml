# Tests and builds every pull request (including ones from forks) and every push to main;
# only pushes to main deploy to Cloudflare Workers (the live site), so a pull request can't
# replace what's live. Pull requests from forks don't get the secrets below at all.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  – your Cloudflare account ID
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Deploys to the live site queue up one after another; test runs on other branches don't wait for them.
  group: ${{ github.ref == 'refs/heads/main' && 'deploy' || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
